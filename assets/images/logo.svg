<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <defs>
    <linearGradient id="o1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="o2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="o3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>
  </defs>
  <!-- Orbital 1: horizontal ellipse -->
  <ellipse cx="30" cy="30" rx="26" ry="10" stroke="url(#o1)" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Orbital 2: tilted 60deg -->
  <ellipse cx="30" cy="30" rx="26" ry="10" stroke="url(#o2)" stroke-width="1.5" fill="none" opacity="0.8" transform="rotate(60 30 30)"/>
  <!-- Orbital 3: tilted -60deg -->
  <ellipse cx="30" cy="30" rx="26" ry="10" stroke="url(#o3)" stroke-width="1.5" fill="none" opacity="0.8" transform="rotate(-60 30 30)"/>
  <!-- Core -->
  <circle cx="30" cy="30" r="5" fill="url(#core)"/>
  <circle cx="30" cy="30" r="2.5" fill="#fff" opacity="0.6"/>
  <!-- Electrons -->
  <circle cx="56" cy="30" r="2.8" fill="#06b6d4"/>
  <circle cx="17" cy="7.5" r="2.8" fill="#7c3aed"/>
  <circle cx="17" cy="52.5" r="2.8" fill="#3b82f6"/>
</svg>
